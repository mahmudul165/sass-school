<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>সংযোগ নেই — আমাদের স্কুল</title>
<style>
  /* ইচ্ছাকৃতভাবে সিস্টেম ফন্ট: অফলাইনে কাস্টম ফন্ট নামবেই না,
     আর নামার চেষ্টা করলে লেখা দেরিতে দেখা যেত। */
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, "Noto Sans Bengali", sans-serif;
    background: #f6f3ec; color: #1b2a24; line-height: 1.8;
  }
  .card {
    max-width: 420px; width: 100%; background: #fff; border: 1px solid #e5dfd2;
    border-radius: 18px; padding: 28px; text-align: center;
    box-shadow: 0 10px 28px -14px rgba(27,42,36,.2);
  }
  .mark {
    width: 52px; height: 52px; margin: 0 auto 16px; display: grid; place-items: center;
    border-radius: 14px; color: #fff; font-weight: 700; font-size: 20px;
    background: linear-gradient(160deg, #b9852a, #7d560f);
  }
  h1 { font-size: 20px; margin: 0 0 8px; line-height: 1.4; }
  p { margin: 0; font-size: 15px; color: #5c6b63; }
  button {
    margin-top: 20px; width: 100%; min-height: 48px; border: 0; border-radius: 12px;
    background: linear-gradient(180deg, #b9852a, #a9761e); color: #fff;
    font-size: 15.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .hint { margin-top: 14px; font-size: 12.5px; color: #8a968f; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">আ</div>
    <h1>এই মুহূর্তে ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না</h1>
    <p>আগে দেখা পাতাগুলো ফোনেই রাখা আছে। সংযোগ ফিরলে নতুন তথ্য নিজে থেকেই চলে আসবে।</p>
    <button onclick="location.reload()">আবার চেষ্টা করুন</button>
    <p class="hint">সংযোগ ফিরলে এই পাতাটি নিজে থেকেই বদলে যাবে।</p>
  </main>
  <script>
    // সংযোগ ফিরলেই নিঃশব্দে আসল পাতায় ফিরে যাওয়া
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>
