<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="বার্ষিক সাংস্কৃতিক অনুষ্ঠান ও পুরস্কার বিতরণী">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1c3d"/><stop offset="1" stop-color="#12102a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe9b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f2340"/><stop offset="0.5" stop-color="#b8324f"/><stop offset="1" stop-color="#8f2340"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#stage)"/>

  <!-- আলোর রশ্মি -->
  <path d="M280 0l-160 640h420L440 0z" fill="url(#beam)"/>
  <path d="M1320 0l160 640h-420l100-640z" fill="url(#beam)"/>

  <!-- পর্দা -->
  <g>
    <path d="M0 0h300v640H0z" fill="url(#curtain)"/>
    <path d="M1300 0h300v640h-300z" fill="url(#curtain)"/>
    <g stroke="#6f1a30" stroke-width="6" opacity="0.6">
      <path d="M60 0v640M120 0v640M180 0v640M240 0v640M1360 0v640M1420 0v640M1480 0v640M1540 0v640"/>
    </g>
    <path d="M0 0h1600v90c-260 60-540 92-800 92S260 150 0 90z" fill="url(#curtain)"/>
  </g>

  <!-- ব্যানার -->
  <g transform="translate(800 190)">
    <rect x="-330" y="-52" width="660" height="104" rx="10" fill="#f6efdd"/>
    <rect x="-330" y="-52" width="660" height="104" rx="10" fill="none" stroke="#c9a227" stroke-width="6"/>
    <g fill="#8f2340" opacity="0.85">
      <rect x="-280" y="-28" width="230" height="18" rx="8"/>
      <rect x="-280" y="4" width="330" height="14" rx="7"/>
    </g>
    <g transform="translate(240 0)">
      <path d="M-18 -30c16-6 30 4 30 18 6 4 10 14 4 22 4 12-2 24-12 32-4 12-16 22-28 18-10-4-14-16-10-26-8-10-8-24 2-32-2-14 4-26 14-32z" fill="#006a4e"/>
      <circle cx="-4" cy="6" r="8" fill="#f42a41"/>
    </g>
  </g>

  <!-- মঞ্চ -->
  <rect y="640" width="1600" height="60" fill="#7a4a30"/>
  <rect y="640" width="1600" height="12" fill="#a9793f"/>
  <rect y="700" width="1600" height="200" fill="#1a1730"/>

  <!-- পরিবেশনায় শিক্ষার্থী -->
  <g>
    <!-- নাচ -->
    <g transform="translate(620 640)">
      <circle cx="0" cy="-160" r="26" fill="#8a5a3b"/>
      <path d="M-26 -138a26 26 0 0 1 52 0c6 18-6 26-26 26s-32-8-26-26z" fill="#2b1f1a"/>
      <path d="M-32 -134h64l18 92h-100z" fill="#e0a03c"/>
      <path d="M-50 -42h100l14 42h-128z" fill="#c94f4f"/>
      <path d="M-32 -120l-56 34 12 22 52-28z" fill="#e0a03c"/>
      <path d="M32 -120l54-40 14 20-52 42z" fill="#e0a03c"/>
    </g>
    <!-- গান (মাইক) -->
    <g transform="translate(800 640)">
      <circle cx="0" cy="-150" r="24" fill="#7a4a30"/>
      <path d="M-28 -126h56l16 126h-88z" fill="#f6efdd"/>
      <path d="M22 -112l30-22 12 18-30 24z" fill="#f6efdd"/>
      <rect x="52" y="-146" width="10" height="34" rx="5" fill="#48595c"/><circle cx="57" cy="-150" r="10" fill="#8d99ac"/>
    </g>
    <!-- পুরস্কার হাতে -->
    <g transform="translate(1000 640)">
      <circle cx="0" cy="-152" r="25" fill="#93643f"/>
      <path d="M-28 -128h56l16 128h-88z" fill="#ffffff"/>
      <path d="M-28 -114l-42 30 12 20 38-26z" fill="#ffffff"/>
      <g transform="translate(-64 -84)">
        <path d="M-16 -22h32v14a16 16 0 0 1-32 0z" fill="#e3c766"/>
        <rect x="-4" y="-8" width="8" height="16" fill="#c9a227"/><rect x="-14" y="8" width="28" height="8" rx="3" fill="#c9a227"/>
        <path d="M-16 -20c-12 0-14 12-4 16M16 -20c12 0 14 12 4 16" stroke="#e3c766" stroke-width="4" fill="none"/>
      </g>
    </g>
  </g>

  <!-- দর্শক (ছায়া) -->
  <g fill="#0d0b1e" opacity="0.9">
    <circle cx="120" cy="820" r="46"/><rect x="70" y="850" width="100" height="60" rx="14"/>
    <circle cx="300" cy="840" r="44"/><rect x="252" y="868" width="96" height="60" rx="14"/>
    <circle cx="500" cy="826" r="46"/><rect x="450" y="856" width="100" height="60" rx="14"/>
    <circle cx="700" cy="846" r="42"/><rect x="654" y="874" width="92" height="60" rx="14"/>
    <circle cx="900" cy="828" r="46"/><rect x="850" y="858" width="100" height="60" rx="14"/>
    <circle cx="1100" cy="844" r="44"/><rect x="1052" y="872" width="96" height="60" rx="14"/>
    <circle cx="1300" cy="826" r="46"/><rect x="1250" y="856" width="100" height="60" rx="14"/>
    <circle cx="1480" cy="842" r="44"/><rect x="1432" y="870" width="96" height="60" rx="14"/>
  </g>
</svg>
